global:
  resolve_timeout: 30s
route:
  receiver: db-gpt
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 2m
receivers:
  - name: db-gpt
    webhook_configs:
      - url: http://python_app:8023/alert
        send_resolved: true
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'instance']
