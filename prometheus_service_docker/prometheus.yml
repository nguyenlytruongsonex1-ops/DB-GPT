global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  # Live demo loads only rules whose series exist on postgres_exporter 0.15.
  # node_rules.yml and pgsql_rules.yml are Pigsty rules (pg_db_*, node_up) and are not mounted.
  - /etc/prometheus/demo_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node_exporter
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: postgres_exporter
    static_configs:
      - targets: ['pg_exporter:9187']
